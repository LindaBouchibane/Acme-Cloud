{% extends '../layouts/base.html' %}
{% block body %}

{% if request.contact %}
  <div class="page-mon-compte">
    {% module "profile"
      path="../modules/Profile.module",
      label="Mon compte"
    %}
  </div>
{% else %}
  <div class="page-mon-compte page-mon-compte--unauthenticated">
    <div class="container">
      <h1>Accès réservé</h1>
      <p>Vous devez être connecté pour accéder à cette page.</p>
      <a class="btn btn--primary" href="{{ portal_login_url }}">Se connecter</a>
    </div>
  </div>
{% endif %}

{% endblock %}
